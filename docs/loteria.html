<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotería — Econometría Avanzada 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 16px 60px;
      color: #fff;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-align: center;
      color: #e2e8f0;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 32px;
      text-align: center;
    }

    /* ── Ruleta ── */
    .wheel-wrap {
      position: relative;
      width: 300px;
      height: 300px;
      margin-bottom: 28px;
    }

    .wheel-ring {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 6px solid #3b82f6;
      box-shadow: 0 0 30px rgba(59,130,246,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 30%, #1e3a5f, #0f172a);
      transition: transform 0.08s linear;
    }

    .winner-display {
      text-align: center;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #93c5fd;
      line-height: 1.4;
      word-break: break-word;
      max-width: 220px;
    }

    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 26px solid #f59e0b;
      filter: drop-shadow(0 2px 6px rgba(245,158,11,0.6));
    }

    /* ── Botón ── */
    .btn-sortear {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff;
      border: none;
      padding: 14px 48px;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(59,130,246,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      margin-bottom: 28px;
    }

    .btn-sortear:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(59,130,246,0.5);
    }

    .btn-sortear:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Resultado ── */
    .result-box {
      display: none;
      background: linear-gradient(135deg, #065f46, #047857);
      border: 2px solid #34d399;
      border-radius: 16px;
      padding: 20px 32px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 0 30px rgba(52,211,153,0.25);
      animation: popIn 0.4s ease;
      max-width: 400px;
      width: 100%;
    }

    .result-box.show { display: block; }

    .result-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #6ee7b7;
      margin-bottom: 6px;
    }

    .result-name {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ecfdf5;
    }

    .result-emoji { font-size: 2rem; margin-top: 6px; }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    /* ── Lista de estudiantes ── */
    .students-section {
      width: 100%;
      max-width: 480px;
    }

    .students-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #64748b;
      margin-bottom: 10px;
      text-align: center;
    }

    .students-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .chip {
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.82rem;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .chip:hover { background: rgba(255,255,255,0.12); }

    .chip.excluded {
      background: rgba(239,68,68,0.12);
      border-color: rgba(239,68,68,0.3);
      color: #f87171;
      text-decoration: line-through;
      opacity: 0.55;
    }

    .chip-hint {
      font-size: 0.75rem;
      color: #475569;
      text-align: center;
      margin-top: 10px;
    }

    /* ── Reset ── */
    .btn-reset {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 7px 20px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.2s;
    }

    .btn-reset:hover { border-color: #94a3b8; color: #e2e8f0; }

    /* ── Confetti ── */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      border-radius: 2px;
      animation: fall linear forwards;
      pointer-events: none;
      z-index: 999;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>🎲 Lotería</h1>
  <p class="subtitle">Econometría Avanzada · Javeriana 2026-1</p>

  <!-- Ruleta visual -->
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <div class="wheel-ring" id="wheel">
      <div class="winner-display" id="spinText">¿Quién presenta?</div>
    </div>
  </div>

  <button class="btn-sortear" id="btnSortear" onclick="sortear()">🎯 Sortear</button>

  <!-- Resultado final -->
  <div class="result-box" id="resultBox">
    <div class="result-label">¡Le toca presentar a!</div>
    <div class="result-name" id="resultName"></div>
    <div class="result-emoji">🎉</div>
  </div>

  <!-- Lista -->
  <div class="students-section">
    <p class="students-title">Grupo activo (clic para excluir)</p>
    <div class="students-grid" id="chipsContainer"></div>
    <p class="chip-hint">Haz clic en un nombre para excluirlo del sorteo</p>
    <div style="text-align:center">
      <button class="btn-reset" onclick="resetAll()">↺ Restablecer todos</button>
    </div>
  </div>

<script>
  const TODOS = [
    "Camilo Alberto González",
    "Carlos Alberto Garzón",
    "Carlos Felipe Cruz",
    "Juanita Ríos",
    "Sofía Peralta",
    "Laura Valentina Lis",
    "Benito Zambrano",
    "Alejandro Prieto",
    "Jimmy Alexander Torres",
    "Carlos Eduardo Puerto",
    "Alejandro Salazar",
    "Juan Daniel Roncancio-Villar",
    "Juan Camilo Vallejo",
    "Karen Melissa Morales",
    "Camila López"
  ];

  let excluidos = new Set();
  let spinning = false;

  // ── Render chips ──
  function renderChips() {
    const container = document.getElementById('chipsContainer');
    container.innerHTML = '';
    TODOS.forEach(nombre => {
      const chip = document.createElement('span');
      chip.className = 'chip' + (excluidos.has(nombre) ? ' excluded' : '');
      chip.textContent = nombre.split(' ')[0] + ' ' + nombre.split(' ')[1]; // "Nombre Apellido"
      chip.title = nombre;
      chip.onclick = () => toggleExcluir(nombre);
      container.appendChild(chip);
    });
  }

  function toggleExcluir(nombre) {
    if (spinning) return;
    if (excluidos.has(nombre)) excluidos.delete(nombre);
    else excluidos.add(nombre);
    renderChips();
  }

  function resetAll() {
    excluidos.clear();
    renderChips();
    document.getElementById('resultBox').classList.remove('show');
    document.getElementById('spinText').textContent = '¿Quién presenta?';
  }

  // ── Sorteo ──
  function sortear() {
    if (spinning) return;

    const activos = TODOS.filter(n => !excluidos.has(n));
    if (activos.length === 0) {
      alert('No hay estudiantes activos. Restablece la lista.');
      return;
    }

    spinning = true;
    document.getElementById('btnSortear').disabled = true;
    document.getElementById('resultBox').classList.remove('show');

    const ganador = activos[Math.floor(Math.random() * activos.length)];
    const shortNames = TODOS.map(n => n.split(' ')[0]);

    let i = 0;
    let speed = 60;
    let elapsed = 0;
    const totalTime = 3000;
    const wheel = document.getElementById('wheel');

    function tick() {
      const nombre = TODOS[i % TODOS.length];
      document.getElementById('spinText').textContent = nombre.split(' ')[0];
      wheel.style.transform = `rotate(${i * 24}deg)`;
      i++;
      elapsed += speed;

      // Desacelerar progresivamente
      if (elapsed > totalTime * 0.6) speed = Math.min(speed + 12, 220);

      if (elapsed < totalTime) {
        setTimeout(tick, speed);
      } else {
        // Mostrar ganador
        document.getElementById('spinText').textContent = ganador.split(' ')[0];
        wheel.style.transform = '';
        mostrarGanador(ganador);
        spinning = false;
        document.getElementById('btnSortear').disabled = false;
      }
    }

    tick();
  }

  function mostrarGanador(nombre) {
    document.getElementById('resultName').textContent = nombre;
    document.getElementById('resultBox').classList.add('show');
    lanzarConfetti();
  }

  // ── Confetti ──
  function lanzarConfetti() {
    const colores = ['#f59e0b','#3b82f6','#10b981','#ec4899','#8b5cf6','#ef4444','#06b6d4'];
    for (let i = 0; i < 80; i++) {
      setTimeout(() => {
        const div = document.createElement('div');
        div.className = 'confetti-piece';
        div.style.left = Math.random() * 100 + 'vw';
        div.style.background = colores[Math.floor(Math.random() * colores.length)];
        div.style.width  = (8 + Math.random() * 8) + 'px';
        div.style.height = (8 + Math.random() * 8) + 'px';
        div.style.animationDuration = (2 + Math.random() * 2) + 's';
        div.style.animationDelay = (Math.random() * 0.5) + 's';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 4000);
      }, i * 20);
    }
  }

  // Init
  renderChips();
</script>
</body>
</html>
